<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>ParcelPilot Ops Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 30px auto; background:#f7f7f8; }
  h2 { margin-bottom: 4px; }
  .snapshot { color: #666; font-size: 13px; margin-bottom: 20px; }
  .card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card h3 { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  .breached { color: #c0392b; font-weight: 600; }
  .approaching { color: #d68910; font-weight: 600; }
  .on_track { color: #27ae60; }
  .multi { background: #fff3cd; }
  a.back { display:inline-block; margin-bottom:14px; color:#1a73e8; text-decoration:none; }
</style>
</head>
<body>
<a class="back" href="/">&larr; Back to chat</a>
<h2>ParcelPilot Ops Dashboard</h2>
<div class="snapshot" id="snapshot">Loading…</div>

<div class="card">
  <h3>SLA Risk (open tickets)</h3>
  <table id="slaTable"><thead><tr><th>Ticket</th><th>Account</th><th>Subject</th><th>Severity</th><th>Elapsed / Target (hrs)</th><th>Status</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
  <h3>Issue Clusters</h3>
  <table id="clusterTable"><thead><tr><th>Topic</th><th>Tickets</th><th>Accounts affected</th><th>Multi-customer?</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
  <h3>Order Anomalies (carrier-fault, still pending)</h3>
  <table id="orderTable"><thead><tr><th>Order</th><th>Account</th><th>Carrier</th><th>Hours late</th><th>Status</th></tr></thead><tbody></tbody></table>
</div>

<script src="dashboard.js"></script>
</body>
</html>
