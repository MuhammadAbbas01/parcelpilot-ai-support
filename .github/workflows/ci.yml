name: CI - Build and Test ParcelPilot AI Support

# Runs automatically on every push or pull request to main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the latest code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Build the Docker image -- fails the pipeline immediately if
      #    the Dockerfile is broken
      - name: Build Docker image
        run: docker build -t parcelpilot-ai-support .

      # 3. Run the container. GROQ_API_KEY is optional here: the tests
      #    below don't call the LLM, so CI passes even without it set
      #    as a repo secret. Add it under Settings -> Secrets -> Actions
      #    to also exercise real chat behavior in future tests.
      - name: Run container
        run: |
          docker run -d -p 8000:8000 \
            -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --name parcelpilot-container \
            parcelpilot-ai-support

      # 4. Wait for the app to actually finish starting up before testing it
      - name: Wait for app to be healthy
        run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/api/health > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app to start... ($i/15)"
            sleep 3
          done
          echo "App did not start in time"
          docker logs parcelpilot-container
          exit 1

      # 5. Install Python test dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install requests pytest

      # 6. Run the real test suite against the running container
      - name: Run tests
        run: pytest test_main.py -v

      # 7. Always show logs and clean up, even if tests failed -- keeps
      #    the runner clean and gives debugging info on failure
      - name: Show container logs (for debugging failures)
        if: always()
        run: docker logs parcelpilot-container

      - name: Clean up
        if: always()
        run: docker rm -f parcelpilot-container
